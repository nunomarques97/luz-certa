name: CI

on:
  push:
  pull_request:

# Read-only token; this workflow uses no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check documents
        run: node scripts/check-docs.mjs

      - name: Self-test the document checker
        run: node scripts/check-docs.mjs --self-test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the tariff catalogue
        run: npm run catalogue:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Browsers are downloaded on the runner only; nothing is installed on developer machines.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and privacy tests
        run: npm run e2e

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  omie-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: OMIE job tests
        run: dotnet test jobs/omie-prices/OmiePrices.slnx
