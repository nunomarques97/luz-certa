<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz Certa: resultados (direção C)</title>
<link rel="stylesheet" href="theme.css">
<style>
  .statement {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-6);
    align-items: end;
    padding: var(--space-6) 0 var(--space-5);
  }
  h1 {
    font: 700 36px / 1.15 var(--font-text);
  }
  .fields {
    display: grid;
    grid-template-columns: repeat(4, auto);
    gap: var(--space-1) var(--space-6);
    margin-top: var(--space-4);
    font-size: 14px;
  }
  .fields dt {
    color: var(--ink-2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .fields dd {
    font-weight: 600;
  }
  .summary {
    padding: var(--space-4) var(--space-5);
    border: 2px solid var(--ink);
    background: var(--sheet);
    font: 17px / 1.45 var(--font-text);
    max-width: 380px;
  }
  .summary b {
    font-family: var(--font-figure);
    font-weight: 700;
  }
  .summary .save {
    color: var(--save);
  }

  /* The ledger: one bill per row on desktop, one receipt per offer on mobile */
  .ledger {
    padding: var(--space-2) var(--space-5) var(--space-4);
  }
  .bill,
  .ledger-head {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) repeat(4, 100px) 120px 120px;
    gap: var(--space-3);
    align-items: baseline;
    padding: var(--space-3) 0;
    border-bottom: 1px solid var(--rule);
  }
  .ledger-head {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    border-bottom: 2px solid var(--ink);
  }
  .ledger-head span:nth-child(n + 3),
  .bill .amount {
    text-align: right;
  }
  .bill .no {
    font: 700 16px var(--font-figure);
    color: var(--ink-2);
  }
  .bill h3 {
    font: 700 17px / 1.3 var(--font-text);
  }
  .bill h3 sup {
    font: 600 12px var(--font-ui);
    color: var(--cost);
  }
  .bill .src {
    font-size: 13px;
    color: var(--ink-2);
  }
  .bill .amount {
    font-family: var(--font-figure);
    font-size: 15px;
  }
  .bill .amount .label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .bill .total {
    font-weight: 700;
    font-size: 17px;
  }
  .bill .diff.save {
    color: var(--save);
    font-weight: 700;
  }
  .bill .diff.cost {
    color: var(--cost);
  }
  .bill.is-current {
    background: var(--mark);
    margin: 0 calc(-1 * var(--space-3));
    padding-left: var(--space-3);
    padding-right: var(--space-3);
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
  }
  .bill .flag {
    display: inline-block;
    margin-left: var(--space-2);
    padding: 0 6px;
    border: 1px solid var(--cost);
    color: var(--cost);
    font: 600 12px var(--font-ui);
    vertical-align: 2px;
  }
  .ledger-foot {
    padding-top: var(--space-3);
    font-size: 13px;
    color: var(--ink-2);
  }

  h2 {
    font: 700 26px / 1.2 var(--font-text);
  }
  .section {
    margin-top: var(--space-7);
  }
  .section-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .section-head label {
    font-size: 14px;
    font-weight: 600;
    margin-right: var(--space-2);
  }
  select {
    min-height: 40px;
    max-width: 100%;
    padding: 0 var(--space-3);
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--sheet);
    font: inherit;
    color: var(--ink);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-figure);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .months-sheet {
    padding: var(--space-4) var(--space-5);
  }
  th,
  td {
    padding: 6px var(--space-2);
    text-align: right;
    border-bottom: 1px dotted var(--rule);
  }
  th {
    font: 600 12px var(--font-ui);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    border-bottom: 2px solid var(--ink);
  }
  th:first-child,
  td:first-child {
    text-align: left;
    font-family: var(--font-ui);
  }
  tfoot td {
    font-weight: 700;
    border-top: 3px double var(--ink);
    border-bottom: 0;
  }
  td.save {
    color: var(--save);
  }
  td.cost {
    color: var(--cost);
  }

  .notes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-6);
    margin-bottom: var(--space-7);
    font: 15px / 1.5 var(--font-text);
  }
  .notes h3 {
    font: 700 14px var(--font-ui);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: var(--space-3);
  }
  .notes ol {
    padding-left: 24px;
    display: grid;
    gap: var(--space-2);
  }
  .notes ol.letters {
    list-style: lower-alpha;
  }
  .notes .closing {
    margin-top: var(--space-5);
    font-size: 14px;
    color: var(--ink-2);
  }

  @media (max-width: 1100px) {
    .bill,
    .ledger-head {
      grid-template-columns: 28px minmax(0, 1fr) repeat(4, 84px) 104px 104px;
    }
  }

  @media (max-width: 720px) {
    .statement {
      grid-template-columns: 1fr;
      gap: var(--space-4);
      padding-top: var(--space-5);
    }
    h1 {
      font-size: 28px;
    }
    .fields {
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2) var(--space-4);
    }
    .ledger {
      padding: 0;
      background: none;
      border: 0;
      box-shadow: none;
    }
    .ledger-head {
      display: none;
    }
    .bill {
      grid-template-columns: 1fr auto;
      gap: 0 var(--space-3);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      background: var(--sheet);
      border: 1px solid var(--rule);
    }
    .bill.is-current {
      margin: 0 0 var(--space-4);
      padding: var(--space-4);
      border: 2px solid var(--ink);
    }
    .bill .no {
      grid-column: 1 / -1;
      font-size: 13px;
    }
    .bill .no::before {
      content: 'N.º ';
    }
    .bill .who {
      grid-column: 1 / -1;
      margin-bottom: var(--space-3);
    }
    .bill .amount {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dotted var(--rule);
    }
    .bill .amount .label {
      position: static;
      width: auto;
      height: auto;
      clip: auto;
      font-family: var(--font-ui);
      color: var(--ink-2);
    }
    .bill .total {
      border-top: 2px solid var(--ink);
      border-bottom: 0;
      margin-top: var(--space-1);
      padding-top: var(--space-2);
    }
    .bill .total .label {
      color: var(--ink);
      font-weight: 700;
    }
    .bill .diff {
      border-bottom: 0;
    }
    .months-sheet {
      padding: var(--space-3);
    }
    .col-detail {
      display: none;
    }
    .section-head label {
      display: block;
      margin-bottom: var(--space-1);
    }
    .section-head select {
      width: 100%;
    }
    .notes {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<header class="wrap bar">
  <a class="brand" href="upload.html">Luz Certa</a>
  <span class="note">O ficheiro não sai do seu dispositivo</span>
</header>
<main class="wrap" id="app"></main>
<script src="../shared/data.js"></script>
<script src="../shared/common.js"></script>
<script>
  const { esc, eur, signedEur, ranking, current, best } = LC;
  const offers = ranking.filter((t) => !t.isCurrent);
  const noted = offers.filter((t) => LC.offerNotes[t.id]);
  const letter = (t) => {
    const i = noted.indexOf(t);
    return i < 0 ? '' : String.fromCharCode(97 + i);
  };

  function bill(t) {
    const l = letter(t);
    const sup = l ? `<sup>(${l})</sup>` : '';
    const flag = t.understated ? '<span class="flag">faltam custos</span>' : '';
    const src = t.isCurrent
      ? 'Preços que indicou: 0,1658 €/kWh e 0,4520 €/dia, sem IVA'
      : `${esc(LC.kindLabel(t))}. <a href="${esc(t.sourceUrl)}">${esc(LC.sourceHost(t))}</a>, verificada em 2 out. 2026`;
    const diff = t.isCurrent
      ? '<span class="label">Contra a sua</span><span>referência</span>'
      : `<span class="label">Contra a sua</span><span>${signedEur(t.diff)}</span>`;
    return `<article class="bill${t.isCurrent ? ' is-current' : ''}" aria-label="${esc(LC.name(t))}">
      <span class="no">${t.rank}</span>
      <div class="who"><h3>${esc(LC.name(t))}${sup}${flag}</h3><p class="src">${src}</p></div>
      <p class="amount"><span class="label">Energia</span><span>${eur(t.breakdown.energy)}</span></p>
      <p class="amount"><span class="label">Potência</span><span>${eur(t.breakdown.power)}</span></p>
      <p class="amount"><span class="label">Taxas</span><span>${eur(t.breakdown.fees)}</span></p>
      <p class="amount"><span class="label">IVA</span><span>${eur(t.breakdown.vat)}</span></p>
      <p class="amount total"><span class="label">Total</span><span>${eur(t.total)}</span></p>
      <p class="amount diff ${t.isCurrent ? '' : t.diff < 0 ? 'save' : 'cost'}">${diff}</p>
    </article>`;
  }

  function monthTable(t) {
    const rows = t.months.map((m, i) => {
      const c = current.months[i];
      const d = m.total - c.total;
      return `<tr><td>${LC.monthLong(m.month)}</td><td class="col-detail">${Math.round(m.kwh)}</td><td class="col-detail">${eur(m.energy)}</td><td class="col-detail">${eur(m.power)}</td><td class="col-detail">${eur(m.fees)}</td><td class="col-detail">${eur(m.vat)}</td><td>${eur(m.total)}</td><td>${eur(c.total)}</td><td class="${d < 0 ? 'save' : 'cost'}">${signedEur(d)}</td></tr>`;
    }).join('');
    const d = t.total - current.total;
    return `<table>
      <thead><tr><th scope="col">Mês</th><th scope="col" class="col-detail">kWh</th><th scope="col" class="col-detail">Energia</th><th scope="col" class="col-detail">Potência</th><th scope="col" class="col-detail">Taxas</th><th scope="col" class="col-detail">IVA</th><th scope="col">Total</th><th scope="col">A sua</th><th scope="col">Dif.</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Ano</td><td class="col-detail">${Math.round(LC.period.totalKwh)}</td><td class="col-detail">${eur(t.breakdown.energy)}</td><td class="col-detail">${eur(t.breakdown.power)}</td><td class="col-detail">${eur(t.breakdown.fees)}</td><td class="col-detail">${eur(t.breakdown.vat)}</td><td>${eur(t.total)}</td><td>${eur(current.total)}</td><td class="${d < 0 ? 'save' : 'cost'}">${signedEur(d)}</td></tr></tfoot>
    </table>`;
  }

  document.getElementById('app').innerHTML = `
    <section class="statement" aria-labelledby="title">
      <div>
        <h1 id="title">O seu ano de 2025 em 11 faturas</h1>
        <dl class="fields">
          <div><dt>Período</dt><dd>1 jan. a 31 dez. 2025</dd></div>
          <div><dt>Consumo</dt><dd class="fig">${LC.kwh(LC.period.totalKwh)}</dd></div>
          <div><dt>Potência</dt><dd>${LC.period.kva}</dd></div>
          <div><dt>Ficheiro</dt><dd>${esc(LC.period.fileName)}</dd></div>
        </dl>
      </div>
      <p class="summary">A sua fatura do ano: <b>${eur(current.total)}</b>. A mais barata, ${esc(LC.name(best))}, daria <b>${eur(best.total)}</b>, <span class="save">${eur(Math.abs(best.diff))} a menos</span>, mas faltam-lhe custos sem valor publicado.</p>
    </section>

    <section class="sheet ledger" aria-label="Faturas anuais por tarifa, da mais barata à mais cara">
      <div class="ledger-head" aria-hidden="true"><span>N.º</span><span>Tarifa</span><span>Energia</span><span>Potência</span><span>Taxas</span><span>IVA</span><span>Total</span><span>Contra a sua</span></div>
      ${ranking.map(bill).join('')}
      <p class="ledger-foot">Valores do período com IVA. Energia, potência e taxas sem IVA. Ordenadas pelo total. As letras remetem para as notas no fim.</p>
    </section>

    <section class="section" aria-labelledby="month-title">
      <div class="section-head">
        <h2 id="month-title">Mês a mês</h2>
        <p><label for="pick">Fatura de</label><select id="pick">${offers.map((t) => `<option value="${t.id}">${esc(LC.name(t))}</option>`).join('')}</select></p>
      </div>
      <div class="sheet months-sheet" id="months"></div>
    </section>

    <section class="section notes" aria-labelledby="notes-title">
      <div>
        <h2 id="notes-title" class="visually-hidden">Notas</h2>
        <h3>Notas gerais</h3>
        <ol>${LC.generalAssumptions.map((a) => `<li>${esc(a)}</li>`).join('')}</ol>
      </div>
      <div>
        <h3>Notas por oferta</h3>
        <ol class="letters">${noted.map((t) => `<li><b>${esc(LC.name(t))}.</b> ${LC.offerNotes[t.id].map(esc).join(' ')}</li>`).join('')}</ol>
        <p class="closing">Fontes oficiais de cada preço indicadas em cada fatura, verificadas em ${LC.verifiedOn}. Catálogo versão 2026.10.02. Nenhuma posição é paga ou patrocinada.</p>
      </div>
    </section>`;

  const pick = document.getElementById('pick');
  const render = () => (document.getElementById('months').innerHTML = monthTable(ranking.find((t) => t.id === pick.value)));
  pick.addEventListener('change', render);
  render();
</script>
</body>
</html>
