<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz Certa: resultados (direção B)</title>
<link rel="stylesheet" href="theme.css">
<style>
  .context {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2) var(--space-5);
    padding-bottom: var(--space-4);
    font-size: 14px;
    color: var(--muted);
  }
  .context a {
    margin-left: auto;
  }
  h1 {
    font: 600 34px / 1.15 var(--font-figure);
    margin: var(--space-4) 0 var(--space-5);
  }
  h2 {
    font: 600 26px / 1.2 var(--font-figure);
  }
  .curve {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: var(--space-6);
  }
  .heat {
    position: relative;
    padding: var(--space-4) var(--space-4) var(--space-3) 64px;
    border-radius: 8px;
    background: var(--surface);
  }
  .heat canvas {
    display: block;
    width: 100%;
  }
  .heat .hours {
    position: absolute;
    left: 0;
    width: 56px;
    top: var(--space-4);
    font-size: 12px;
    color: var(--muted);
  }
  .heat .hours span {
    position: absolute;
    right: 8px;
    transform: translateY(-50%);
  }
  .heat .band {
    position: absolute;
    left: 6px;
    width: 4px;
    background: var(--empty-band);
    border-radius: 2px;
  }
  .heat .months {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    margin-top: var(--space-2);
    font-size: 12px;
    color: var(--muted);
  }
  .heat-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: var(--space-3);
    margin-top: var(--space-3);
    font-size: 13px;
    color: var(--muted);
  }
  .heat-foot .band-key::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 12px;
    margin-right: var(--space-2);
    background: var(--empty-band);
    vertical-align: -1px;
  }
  .facts {
    display: grid;
    gap: var(--space-5);
    align-content: start;
  }
  .facts div {
    border-top: 2px solid var(--line);
    padding-top: var(--space-3);
  }
  .facts dt {
    font-size: 14px;
    color: var(--muted);
  }
  .facts dd {
    font: 600 30px / 1.15 var(--font-figure);
  }
  .facts dd small {
    display: block;
    font: 400 14px / 1.4 var(--font);
    color: var(--muted);
  }

  /* Tariffs against the curve */
  .against {
    margin-top: var(--space-7);
  }
  .against .lead {
    margin: var(--space-2) 0 var(--space-5);
    max-width: 80ch;
    color: var(--muted);
  }
  .grid-row {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) 432px 120px 130px;
    gap: var(--space-4);
    align-items: center;
    padding: var(--space-2) var(--space-3);
  }
  .profile-row {
    align-items: end;
    font-size: 13px;
    color: var(--muted);
  }
  .profile {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 2px;
    align-items: end;
    height: 72px;
  }
  .profile i {
    display: block;
    background: var(--heat-3);
    border-radius: 2px 2px 0 0;
  }
  .ticks {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    font-size: 11px;
    color: var(--muted);
  }
  .tariffs {
    list-style: none;
    padding: 0;
  }
  .tariffs li {
    border-top: 1px solid var(--line);
  }
  .tariffs li.current {
    background: var(--surface-2);
    border-radius: 6px;
    border-top-color: transparent;
    outline: 2px solid var(--heat-3);
    outline-offset: -2px;
  }
  .rank {
    font: 700 18px var(--font-figure);
    color: var(--muted);
    text-align: right;
  }
  .who b {
    display: block;
    font-weight: 600;
  }
  .who span {
    font-size: 13px;
    color: var(--muted);
  }
  .strip {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 2px;
    height: 22px;
  }
  .strip i {
    border-radius: 2px;
  }
  .total {
    text-align: right;
    font: 600 20px var(--font-figure);
  }
  .delta {
    text-align: right;
    font: 600 16px var(--font-figure);
  }
  .delta.cheap {
    color: var(--cheap);
  }
  .delta.dear {
    color: var(--dear);
  }
  .delta.same {
    color: var(--heat-4);
  }
  .tag {
    display: inline-block;
    margin-left: var(--space-2);
    padding: 0 6px;
    border: 1px solid var(--heat-3);
    border-radius: 4px;
    font-size: 12px;
    color: var(--heat-4);
  }
  .strip-key {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2) var(--space-5);
    margin-top: var(--space-4);
    font-size: 13px;
    color: var(--muted);
  }
  .strip-key i {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: var(--space-2);
    border-radius: 2px;
    vertical-align: -2px;
  }

  /* Monthly */
  .monthly {
    margin-top: var(--space-7);
  }
  table {
    width: 100%;
    margin-top: var(--space-4);
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th,
  td {
    padding: 6px var(--space-3);
    border-bottom: 1px solid var(--line);
    text-align: right;
  }
  th {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  th:first-child,
  td:first-child {
    text-align: left;
  }
  td.mini {
    width: 300px;
  }
  td.mini .strip {
    height: 14px;
    gap: 1px;
  }
  tfoot td {
    font-weight: 700;
    border-bottom: 0;
  }
  .cheap {
    color: var(--cheap);
  }
  .dear {
    color: var(--dear);
  }

  /* Assumptions */
  .assume {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-6);
    margin: var(--space-7) 0;
    padding-top: var(--space-6);
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .assume h2 {
    grid-column: 1 / -1;
  }
  .assume h3 {
    font-size: 15px;
    margin-bottom: var(--space-2);
  }
  .assume ul {
    display: grid;
    gap: var(--space-2);
    padding-left: 18px;
    color: var(--muted);
  }
  .assume li b {
    color: var(--text);
    font-weight: 600;
  }
  .sources li {
    color: var(--muted);
  }
  .foot {
    padding-bottom: var(--space-7);
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 1100px) {
    .grid-row {
      grid-template-columns: 32px minmax(0, 1fr) 300px 110px 110px;
    }
  }

  @media (max-width: 720px) {
    .context a {
      margin-left: 0;
    }
    h1 {
      font-size: 26px;
    }
    h2 {
      font-size: 22px;
    }
    .curve {
      grid-template-columns: 1fr;
      gap: var(--space-5);
    }
    .heat {
      padding: var(--space-3) var(--space-3) var(--space-3) 44px;
    }
    .heat .hours {
      width: 40px;
    }
    .facts {
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }
    .facts dd {
      font-size: 24px;
    }
    .grid-row {
      grid-template-columns: 28px minmax(0, 1fr) auto;
      grid-template-areas:
        'rank who who'
        '. strip strip'
        '. total delta';
      gap: var(--space-2) var(--space-3);
    }
    .grid-row .rank {
      grid-area: rank;
      text-align: left;
      align-self: start;
    }
    .grid-row .who {
      grid-area: who;
    }
    .grid-row .strip,
    .grid-row .profile-cell {
      grid-area: strip;
    }
    .grid-row .total {
      grid-area: total;
      text-align: left;
    }
    .grid-row .delta {
      grid-area: delta;
    }
    .profile-row .who {
      display: none;
    }
    td.mini,
    th.mini,
    .col-kwh {
      display: none;
    }
    th,
    td {
      padding: 6px var(--space-2);
      font-size: 15px;
    }
    .assume {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="upload.html">Luz Certa</a>
  <span class="note">O ficheiro não sai do seu dispositivo</span>
</header>
<main class="wrap" id="app"></main>
<script src="../shared/data.js"></script>
<script src="../shared/common.js"></script>
<script>
  const { esc, eur, signedEur, ranking, current, best, data } = LC;
  const mobile = matchMedia('(max-width: 720px)').matches;

  // Hourly profile and shares from the curve.
  const profile = new Array(24).fill(0);
  data.heat.forEach((day) => day.forEach((v, h) => (profile[h] += v / data.heat.length)));
  const daily = data.ranking.find((t) => t.id === 'ezu-premium-bi-hourly').kwhByPeriod;
  const emptyShare = daily.empty / (daily.empty + daily.outOfEmpty);
  const peak = profile.indexOf(Math.max(...profile));
  const jan = current.months[0].kwh, jul = current.months[6].kwh;

  const stops = ['#17243b', '#22487a', '#2f7fa3', '#e1a53c', '#ffe18c'].map((hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)));
  function heatColour(t) {
    const x = Math.min(1, Math.max(0, t)) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(x));
    const f = x - i;
    const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
    return `rgb(${c.join(',')})`;
  }

  // Price shape per tariff: 0 = cheapest hours of that tariff, 1 = dearest, null = flat price.
  const omieMin = Math.min(...data.omieHourly), omieMax = Math.max(...data.omieHourly);
  function shape(t) {
    const empty = (h) => (t.cycle === 'weekly' ? h < 7 : h >= 22 || h < 8);
    if (t.pricing === 'omie_indexed') {
      return data.omieHourly.map((p, h) => {
        const o = (p - omieMin) / (omieMax - omieMin);
        return t.tariffType === 'bi_hourly' ? 0.5 * o + (empty(h) ? 0 : 0.5) : o;
      });
    }
    if (t.tariffType === 'bi_hourly') return profile.map((_, h) => (empty(h) ? 0 : 1));
    return null;
  }
  function stripColour(v) {
    if (v === null) return '#4a5d80';
    const a = [87, 210, 160], b = [255, 142, 110];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * v)).join(',')})`;
  }
  function strip(t) {
    const s = shape(t);
    return `<span class="strip" aria-hidden="true">${profile.map((_, h) => `<i style="background:${stripColour(s ? s[h] : null)}"></i>`).join('')}</span>`;
  }

  function tariffRow(t) {
    const delta = t.isCurrent
      ? '<span class="delta same">a sua</span>'
      : `<span class="delta ${t.diff < 0 ? 'cheap' : 'dear'}">${signedEur(t.diff)}</span>`;
    const tag = t.understated ? '<span class="tag">valor mínimo</span>' : '';
    const kind = t.isCurrent ? 'Preço único que indicou' : LC.kindLabel(t);
    return `<li class="${t.isCurrent ? 'current' : ''}"><div class="grid-row">
      <span class="rank">${t.rank}</span>
      <span class="who"><b>${esc(LC.name(t))}${tag}</b><span>${esc(kind)}</span></span>
      ${strip(t)}
      <span class="total">${eur(t.total)}</span>
      ${delta}
    </div></li>`;
  }

  // Monthly hourly profiles.
  const monthProfiles = Array.from({ length: 12 }, () => new Array(24).fill(0));
  const monthDays = new Array(12).fill(0);
  data.days.forEach((d, i) => {
    const m = Number(d.slice(5, 7)) - 1;
    monthDays[m]++;
    data.heat[i].forEach((v, h) => (monthProfiles[m][h] += v));
  });
  const monthMax = Math.max(...monthProfiles.flatMap((p, m) => p.map((v) => v / monthDays[m])));

  const pMax = Math.max(...profile);
  const offers = ranking.filter((t) => !t.isCurrent);

  document.getElementById('app').innerHTML = `
    <p class="context"><span>${esc(LC.period.label)}</span><span>${LC.period.kva}</span><span>${esc(LC.period.fileName)}</span><a href="upload.html">Outro ficheiro</a></p>
    <h1>O seu consumo em 2025, hora a hora</h1>
    <section class="curve" aria-label="Curva de consumo">
      <figure class="heat" style="margin:0">
        <div class="hours" id="hours"></div>
        <canvas id="heat" role="img" aria-label="Mapa de calor do consumo: ${mobile ? 'semanas em linhas, horas em colunas' : 'dias em colunas, horas em linhas'}. Mais claro significa mais consumo."></canvas>
        <div class="months" id="months"></div>
        <figcaption class="heat-foot"><span class="band-key">Horas de vazio, 22h às 8h</span><span class="legend-scale">menos <i></i> mais kWh por hora</span></figcaption>
      </figure>
      <dl class="facts">
        <div><dt>Consumo no período</dt><dd class="figure">${LC.kwh(LC.period.totalKwh)}<small>365 dias, sem falhas, 66 leituras estimadas</small></dd></div>
        <div><dt>Nas horas de vazio</dt><dd class="figure">${LC.pct(emptyShare)}<small>das 22h às 8h</small></dd></div>
        <div><dt>Hora de maior consumo</dt><dd class="figure">${peak}h às ${peak + 1}h<small>em média, todo o ano</small></dd></div>
        <div><dt>Janeiro contra julho</dt><dd class="figure">${LC.num1(jan / jul).replace(',0', '')} vezes<small>${Math.round(jan)} kWh contra ${Math.round(jul)} kWh</small></dd></div>
      </dl>
    </section>

    <section class="against" aria-labelledby="against-title">
      <h2 id="against-title">As 11 tarifas lidas contra a sua curva</h2>
      <p class="lead">${LC.pct(emptyShare)} do seu consumo cai nas horas de vazio. É essa parte que fica mais barata numa tarifa bi-horária. Nas indexadas, o preço segue o mercado OMIE hora a hora e é mais baixo a meio do dia.</p>
      <div class="grid-row profile-row" aria-hidden="true">
        <span></span><span class="who">Quando gasta, média por hora</span>
        <span class="profile-cell"><span class="profile">${profile.map((v) => `<i style="height:${Math.round((v / pMax) * 100)}%"></i>`).join('')}</span><span class="ticks"><span>0h</span><span>6h</span><span>12h</span><span>18h</span></span></span>
        <span class="total" style="font:13px var(--font);color:var(--muted)">Custo no ano</span><span class="delta" style="font:13px var(--font);color:var(--muted)">Contra a sua</span>
      </div>
      <ol class="tariffs">${ranking.map(tariffRow).join('')}</ol>
      <p class="strip-key"><span><i style="background:${stripColour(0)}"></i>horas mais baratas dessa tarifa</span><span><i style="background:${stripColour(1)}"></i>horas mais caras</span><span><i style="background:${stripColour(null)}"></i>o mesmo preço a toda a hora</span></p>
    </section>

    <section class="monthly" aria-labelledby="month-title">
      <h2 id="month-title">Mês a mês: a sua tarifa e a ${esc(LC.name(best))}</h2>
      <table>
        <thead><tr><th scope="col">Mês</th><th scope="col" class="mini">Perfil do dia</th><th scope="col" class="col-kwh">kWh</th><th scope="col">Atual</th><th scope="col">${esc(best.name.split(' ')[0])}</th><th scope="col">Diferença</th></tr></thead>
        <tbody>${current.months.map((m, i) => {
          const o = best.months[i];
          const d = o.total - m.total;
          const p = monthProfiles[i].map((v) => `<i style="background:${heatColour(v / monthDays[i] / monthMax)}"></i>`).join('');
          return `<tr><td>${LC.monthLong(m.month)}</td><td class="mini"><span class="strip">${p}</span></td><td class="col-kwh">${Math.round(m.kwh)}</td><td>${eur(m.total)}</td><td>${eur(o.total)}</td><td class="${d < 0 ? 'cheap' : 'dear'}">${signedEur(d)}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="mini"></td><td class="col-kwh">${Math.round(LC.period.totalKwh)}</td><td>${eur(current.total)}</td><td>${eur(best.total)}</td><td class="cheap">${signedEur(best.total - current.total)}</td></tr></tfoot>
      </table>
    </section>

    <section class="assume" aria-labelledby="assume-title">
      <h2 id="assume-title">Pressupostos e fontes</h2>
      <div>
        <h3>Para todas as tarifas</h3>
        <ul>${LC.generalAssumptions.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>
      </div>
      <div>
        <h3>Ofertas indexadas</h3>
        <ul>${offers.filter((t) => LC.offerNotes[t.id]).map((t) => `<li><b>${esc(LC.name(t))}.</b> ${LC.offerNotes[t.id].map(esc).join(' ')}</li>`).join('')}</ul>
        <h3 style="margin-top:var(--space-5)">Fontes, verificadas em ${LC.verifiedOn}</h3>
        <ul class="sources">${offers.map((t) => `<li>${esc(LC.name(t))}: <a href="${esc(t.sourceUrl)}">${esc(LC.sourceHost(t))}</a></li>`).join('')}</ul>
      </div>
    </section>
    <p class="foot">Nenhuma posição é paga ou patrocinada. Os valores são uma estimativa com os pressupostos acima.</p>`;

  // Heatmap: days x hours on desktop, weeks x hours on mobile.
  const canvas = document.getElementById('heat');
  const cssWidth = canvas.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  let rows, cols, value;
  if (mobile) {
    const weeks = Math.ceil(data.heat.length / 7);
    rows = weeks; cols = 24;
    const sums = Array.from({ length: weeks }, (_, w) => profile.map((_, h) => data.heat.slice(w * 7, w * 7 + 7).reduce((s, d) => s + d[h], 0) / Math.min(7, data.heat.length - w * 7)));
    value = (r, c) => sums[r][c];
  } else {
    rows = 24; cols = data.heat.length;
    value = (r, c) => data.heat[c][r];
  }
  const cell = mobile ? cssWidth / cols : cssWidth / cols;
  const rowH = mobile ? 7 : 13;
  const cssHeight = rows * rowH;
  canvas.style.height = cssHeight + 'px';
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  const g = canvas.getContext('2d');
  g.scale(dpr, dpr);
  const all = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) all.push(value(r, c));
  all.sort((a, b) => a - b);
  const heatTop = all[Math.floor(all.length * 0.98)];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      g.fillStyle = heatColour(value(r, c) / heatTop);
      g.fillRect(c * cell, r * rowH, cell + 0.4, rowH - (mobile ? 1 : 1));
    }
  }
  // Axis labels and the empty-hours band.
  const hoursEl = document.getElementById('hours');
  const monthsEl = document.getElementById('months');
  if (mobile) {
    hoursEl.innerHTML = '';
    monthsEl.style.gridTemplateColumns = 'repeat(4, 1fr)';
    monthsEl.innerHTML = '<span>0h</span><span>6h</span><span>12h</span><span>18h</span>';
    const labels = ['jan', 'abr', 'jul', 'out'];
    hoursEl.innerHTML = labels.map((m, i) => `<span style="top:${(i * 13 * rowH) + rowH / 2}px">${m}</span>`).join('');
    const band = (from, to) => `<i class="band" style="position:absolute;top:auto;bottom:-10px;left:${(from / 24) * 100}%;width:${((to - from) / 24) * 100}%;height:4px"></i>`;
    canvas.insertAdjacentHTML('afterend', `<div style="position:relative;height:6px;margin-top:4px">${band(0, 8)}${band(22, 24)}</div>`);
  } else {
    hoursEl.innerHTML = [0, 6, 12, 18, 24].map((h) => `<span style="top:${h * rowH}px">${h}h</span>`).join('');
    hoursEl.insertAdjacentHTML('beforeend', `<i class="band" style="top:0;height:${8 * rowH}px"></i><i class="band" style="top:${22 * rowH}px;height:${2 * rowH}px"></i>`);
    monthsEl.innerHTML = current.months.map((m) => `<span>${LC.monthShort(m.month)}</span>`).join('');
  }
</script>
</body>
</html>
