# Commercial offers for BTN households in Portugal continental. Prices exclude VAT and include
# the access tariffs (TAR) unless a formula says TAR is added by consumption date.
# Offers are sorted alphabetically by id; the order is not a ranking. There are no sponsored,
# affiliate or ranking fields, and the validator rejects any field it does not know.
#
# Fixed offers (pricing: fixed): current published prices, used as they are for past consumption.
# Indexed offers (pricing: omie_indexed): energy per kWh is computed from structured parameters:
#   ((OMIE + k_eur_mwh) x (1 + loss_factor.value) x multiplier + adder_eur_mwh) / 1000
#   + TAR energy for the consumption date (includes_tar: true) + extra_fees.
# Nothing in this file is evaluated as an expression.
