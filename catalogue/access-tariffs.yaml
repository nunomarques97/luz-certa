# ERSE access tariffs (Tarifas de Acesso às Redes, TAR) for BTN up to 20.7 kVA, Portugal continental.
# Energy in EUR/kWh, power in EUR/day, VAT excluded. Validity dates are inclusive.
# Periods must not overlap and must cover the whole catalogue period without gaps.
# Indexed offers add these values by consumption date; fixed offers already include them.
